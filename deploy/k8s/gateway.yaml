apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ddwmd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: ddwmd/gateway:0.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GATEWAY_PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: ddwmd-config
            - secretRef:
                name: ddwmd-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ddwmd
spec:
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
