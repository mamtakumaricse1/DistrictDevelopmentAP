apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: ddwmd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: identity
          image: ddwmd/identity:0.1.0
          ports:
            - containerPort: 3001
          env:
            - name: IDENTITY_PORT
              value: "3001"
          envFrom:
            - configMapRef:
                name: ddwmd-config
            - secretRef:
                name: ddwmd-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3001
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: ddwmd
spec:
  selector:
    app: identity
  ports:
    - port: 3001
      targetPort: 3001
