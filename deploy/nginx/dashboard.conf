# NIC Linux Nginx template.
# Replace server_name and TLS paths before production use.
# PostgreSQL and NestJS bind to localhost only.

upstream ddwmd_api {
  least_conn;
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name works.example.gov.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name works.example.gov.in;

  # ssl_certificate     /etc/ssl/certs/district.crt;
  # ssl_certificate_key /etc/ssl/private/district.key;
  # ssl_protocols       TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-XSS-Protection "0" always;

  root /var/www/ddwmd;
  index index.html;
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://ddwmd_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
